<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <h1 style="background-color:aliceblue; padding: 5px 0;">Pingwi</h1>
    <p>Hi friend, nice to see you here :)</p>

    <hr>
    <h4>My film photos:</h4>
    <img src="images/film/R-0003.jpeg"
         id="film_1"
         alt="beach - Calabria, Italy"
         style="width: 50%; cursor: zoom-in;"
         onclick="imgClick()"
    >
    <img src="images/film/R-0002.jpeg"
         id="film_2"
         alt="tram - Vienna, Austria"
         style="width: 50%; cursor: zoom-in;"
         onclick="imgClick()"
    >
    <img src="images/film/R-0001.jpeg"
         id="film_3"
         alt="sea - Zanzibar, Tanzania"
         style="width: 50%; cursor: zoom-in;"
         onclick="imgClick()"
    >

    <script>
        function imgClick(imgId) {
            const img = document.getElementById(imgId);

            if (!img) return;

            if (img.style.width === "100%") {
                img.style.width = "50%";
                img.style.transition = "transform 0.25s ease";
                img.style.cursor = "zoom-in";
            } else {
                img.style.width = "100%";
                img.style.transition = "transform 0.25s ease";
                img.style.cursor = "zoom-out";
            }
        }

        document.addEventListener('click', function(e) {
            imgClick(e.target.id)
        }, false);
    </script>
</body>
</html>
